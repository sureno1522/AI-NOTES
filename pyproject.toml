[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-college-notes-assistant"
version = "0.1.0"
description = "Streamlit-based college notes assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.25.0",
    "langchain>=0.0.300",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "python-docx>=0.8.11",
    "python-pptx>=0.6.21",
    "pdfplumber>=0.10.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "ollama>=0.1.0",
    "Flask>=2.3.0",
    "typing-extensions>=4.7.1",
]

[tool.vercel]
entrypoint = "main.py"
