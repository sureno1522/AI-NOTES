[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-college-notes-assistant"
version = "0.1.0"
description = "Streamlit-based college notes assistant with a Vercel placeholder deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=2.3.0",
]

[tool.vercel]
entrypoint = "main.py"
